# Las imagenes de Docker y las acciones de GitHub estan fijadas por digest o SHA
# (no por etiqueta), y las dependencias por version exacta: Dependabot abre un
# pull request cada semana con lo que haya que actualizar, y las pruebas de
# .github/workflows/pruebas.yml lo revisan antes de aceptarlo.
#
# Lo menor va agrupado en un solo pull request por ecosistema. Quedan fuera los
# saltos que no se deben aceptar solo porque las pruebas pasen:
#   - PostgreSQL de version mayor: no lee los datos de la anterior. Las pruebas
#     usan una base nueva y no lo detectan. Se hace aparte, con respaldo.
#   - nginx impar (1.31, 1.33): es la linea de desarrollo, no la estable.
#   - Python y Node de version mayor: se prueban a mano.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        versions: ["1.31.x", "1.33.x", "1.35.x"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      acciones:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      javascript:
        update-types: [minor, patch]
