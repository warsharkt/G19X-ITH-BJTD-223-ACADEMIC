# Talentia Insights completo en Docker: base de datos, API y tablero.
#
#   docker compose up -d --build   -> todo; el tablero queda en http://localhost:8080
#   docker compose up -d db        -> solo la base (para programar con la API y
#                                     el tablero en modo desarrollo)
#
# Todo se publica solo en este mismo equipo (127.0.0.1): otra computadora de la
# red no puede entrar. *_ESCUCHA en el .env lo cambia si de verdad hace falta.
# La IA local (Ollama) corre fuera de Docker, en el mismo equipo.
#
# Cada contenedor corre con lo minimo (hallazgo 9 de la segunda auditoria):
# sin privilegios extra (no-new-privileges), sin capacidades de Linux salvo
# las que necesita, y con el sistema de archivos de solo lectura (solo escriben
# en sus volumenes y en memoria, tmpfs).
services:
  db:
    # Fijada por digest; Dependabot propone las actualizaciones
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: rrhh_db
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # el arranque de PostgreSQL ajusta el dueno y los permisos de sus datos y
    # luego deja de ser root
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_ESCUCHA:-127.0.0.1}:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rrhh_api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # /home/talentia: pip install --user al correr las pruebas en un contenedor
    # aparte. Con dueno: sin uid, el tmpfs queda de root y la API no puede escribir.
    tmpfs: [/tmp, "/home/talentia:uid=10001,gid=10001,mode=700"]
    env_file: .env
    environment:
      # Siempre la base de este compose, aunque el .env traiga otra DATABASE_URL
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      # Ollama corre en el equipo, fuera de Docker
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Llave que cifra los secretos del MFA (se genera sola la primera vez si no
    # hay MFA_LLAVE en el .env). Fuera de la base: un respaldo de la base no la lleva.
    volumes:
      - ./llaves:/app/llaves
    depends_on:
      db:
        condition: service_healthy
    # Para ver la documentacion interactiva en http://localhost:8000/docs
    ports:
      - "${API_ESCUCHA:-127.0.0.1}:8000:8000"

  web:
    build: ./frontend
    container_name: rrhh_web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # puertos 80/443, el cambio al usuario nginx y sus carpetas de trabajo.
    # DAC_OVERRIDE: nginx lee como root la llave de certs/, que en un servidor
    # Linux es de quien la copio y con permisos 600; sin esto no arranca.
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    # conf.d: talentia-https.sh escribe ahi la configuracion al arrancar
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    depends_on:
      api:
        condition: service_healthy
    # HTTPS: automatico en cuanto el tablero se abre a la red (WEB_ESCUCHA
    # distinto de 127.0.0.1). Certificado de la empresa en certs/; si no hay,
    # se genera uno autofirmado (frontend/nginx/talentia-https.sh).
    environment:
      WEB_ESCUCHA: ${WEB_ESCUCHA:-127.0.0.1}
      WEB_HTTPS: ${WEB_HTTPS:-auto}
      WEB_NOMBRE: ${WEB_NOMBRE:-localhost}
      WEB_PUERTO_HTTPS: ${WEB_PUERTO_HTTPS:-8443}
    volumes:
      - ./certs:/etc/nginx/certs
    ports:
      - "${WEB_ESCUCHA:-127.0.0.1}:8080:80"
      - "${WEB_ESCUCHA:-127.0.0.1}:${WEB_PUERTO_HTTPS:-8443}:443"

volumes:
  pgdata:
