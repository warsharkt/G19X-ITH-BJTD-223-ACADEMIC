# Limite de intentos de inicio de sesion por IP (va en el contexto http:
# lo incluyen http.conf y https.conf fuera del bloque server). 10 por minuto
# con 5 de rafaga: alcanza para equivocarse, no para probar contrasenas
# contra muchas cuentas. Lo que pase del limite recibe 429.
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
# El resto de la API: holgado para una oficina detras de una sola IP (abrir el
# tablero son unas 20 peticiones), pero una sola maquina no acapara los hilos.
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_status 429;
