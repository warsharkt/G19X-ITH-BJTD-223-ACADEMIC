# Con HTTPS: el puerto 80 solo redirige; contrasenas, codigos y datos viajan
# cifrados por el 443. PUERTO_HTTPS lo cambia talentia-https.sh por el
# puerto publicado (WEB_PUERTO_HTTPS, 8443 por defecto).
server {
    listen 80;
    server_tokens off;
    return 301 https://$host:PUERTO_HTTPS$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/talentia.crt;
    ssl_certificate_key /etc/nginx/certs/talentia.key;
    # Configuracion "intermedia" de Mozilla: TLS 1.2 y 1.3, sin cifrados viejos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # El navegador ya no vuelve a intentar HTTP en este sitio
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/talentia/comun.conf;
}
