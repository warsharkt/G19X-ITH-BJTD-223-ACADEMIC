# Lo que comparten la version con y sin HTTPS: sirve el tablero compilado y
# reenvia /api/* a la API (servicio api de docker-compose.yml). La API no
# necesita CORS: todo sale de la misma direccion.
root /usr/share/nginx/html;

# Carga de datos: archivos de hasta 5 MB (la API valida el limite)
client_max_body_size 6m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Solo se ejecuta el codigo del propio tablero: si algun dia se colara un
# script (XSS), el navegador no lo corre ni lo deja mandar datos a otro
# sitio. El token de sesion vive en sessionStorage, asi que esto importa.
# style-src 'unsafe-inline': las graficas (Recharts) usan estilos en linea;
# no ejecutan codigo. Las fuentes vienen de Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Inicio de sesion y codigo de verificacion: limitados por IP (limites.conf)
location = /api/auth/login {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass http://api:8000/auth/login;
    include /etc/nginx/talentia/proxy-api.conf;
}

location = /api/auth/mfa {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass http://api:8000/auth/mfa;
    include /etc/nginx/talentia/proxy-api.conf;
}

# La documentacion interactiva de la API describe cada endpoint: no se
# publica en la red. Se consulta en http://localhost:8000/docs desde el
# propio servidor (la API solo escucha en 127.0.0.1).
location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
    return 404;
}

location /api/ {
    proxy_pass http://api:8000/;
    include /etc/nginx/talentia/proxy-api.conf;
}

# Rutas del tablero (React Router): cualquier ruta abre index.html
location / {
    try_files $uri /index.html;
}
