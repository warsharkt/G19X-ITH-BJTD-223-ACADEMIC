# Lo que comparten la version con y sin HTTPS: sirve el tablero compilado y
# reenvia /api/* a la API (servicio api de docker-compose.yml). La API no
# necesita CORS: todo sale de la misma direccion.
root /usr/share/nginx/html;

# Carga de datos: archivos de hasta 5 MB (la API valida el limite)
client_max_body_size 6m;

# Comprime el tablero. application/json NO va a proposito: comprimir respuestas
# de la API que mezclan secretos con texto que manda el usuario abre la puerta
# a BREACH. Son respuestas chicas y no se nota.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Solo se ejecuta el codigo del propio tablero: si algun dia se colara un
# script (XSS), el navegador no lo corre ni lo deja mandar datos a otro
# sitio. El token de sesion vive en sessionStorage, asi que esto importa.
# style-src 'unsafe-inline': las graficas (Recharts) usan estilos en linea;
# no ejecutan codigo. Nada se carga de otro sitio: ni la fuente (va con el
# tablero), asi el navegador no le avisa a terceros que se abrio el sistema.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Inicio de sesion, codigo de verificacion y cambio de contrasena: limitados por IP (limites.conf)
location = /api/auth/login {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass http://api:8000/auth/login;
    include /etc/nginx/talentia/proxy-api.conf;
}

location = /api/auth/mfa {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass http://api:8000/auth/mfa;
    include /etc/nginx/talentia/proxy-api.conf;
}

location = /api/auth/contrasena {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass http://api:8000/auth/contrasena;
    include /etc/nginx/talentia/proxy-api.conf;
}

# La documentacion interactiva de la API describe cada endpoint: no se
# publica en la red. Se consulta en http://localhost:8000/docs desde el
# propio servidor (la API solo escucha en 127.0.0.1).
location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
    return 404;
}

location /api/ {
    limit_req zone=general burst=100 nodelay;
    proxy_pass http://api:8000/;
    include /etc/nginx/talentia/proxy-api.conf;
}

# Los archivos compilados llevan su huella en el nombre y cambian con cada
# version. Si una pestana vieja pide uno que ya no existe, 404: con index.html
# el navegador rechaza el modulo y el error es dificil de entender.
#
# expires y no add_header: un add_header aqui borraria las cabeceras de
# seguridad de arriba (nginx no hereda las que ya tiene el bloque de afuera).
location /assets/ {
    try_files $uri =404;
    expires 1y;  # el nombre cambia con el contenido: se puede guardar sin miedo
}

# Rutas del tablero (React Router): cualquier ruta abre index.html, que se
# revisa siempre: es el que dice que archivos de /assets/ usar.
location / {
    try_files $uri /index.html;
    expires -1;
}
