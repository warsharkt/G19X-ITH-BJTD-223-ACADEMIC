# Lo que necesita cada location que reenvia a la API. X-Forwarded-For se
# REEMPLAZA por la IP real (no se agrega a la que mande el navegador), para
# que nadie pueda hacerse pasar por otra IP y saltarse el bloqueo por intentos.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 120s;
