# Sirve el tablero compilado y reenvia /api/* a la API (servicio api de
# docker-compose.yml). La API no necesita CORS: todo sale de la misma direccion.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Carga de datos: archivos de hasta 5 MB (la API valida el limite)
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rutas del tablero (React Router): cualquier ruta abre index.html
    location / {
        try_files $uri /index.html;
    }
}
